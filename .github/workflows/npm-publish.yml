name: Publish BontaFlowStack npm package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact protected source tag, for example v1.2.1
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm CLI with OIDC dist-tag support
        run: npm install --global npm@11.21.0
      - name: Confirm selected source tag and select npm dist-tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(node -p "require('./installers/npm/package.json').version")"
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo 'The selected Git tag must exactly match the installer package version.' >&2
            exit 1
          fi
          case "$version" in *-*) dist_tag=rc ;; *) dist_tag=latest ;; esac
          echo "BFS_NPM_DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
      - name: Run repository checks
        run: node scripts/check.mjs
      - name: Verify npm release policy and tarball safety
        run: node --test tests/npm-release.test.mjs
      - name: Prepare exact npm tarball
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/npm-release.mjs prepare --output artifacts/npm-release --tag "$BFS_NPM_DIST_TAG" --release-tag "$RELEASE_TAG"
      - name: Publish and verify the same tarball
        run: node scripts/npm-release.mjs publish --artifact artifacts/npm-release --tag "$BFS_NPM_DIST_TAG"
