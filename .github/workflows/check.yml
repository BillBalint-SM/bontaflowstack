name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    # Dedicated release-proof pushes run only the three gate cases in release-gate-proof.yml.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/codex/release-gate-proof-')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # These source artifacts are candidates, never final releases.
      - run: ./scripts/build-package.ps1 -OutputDirectory artifacts/source-check
      - run: ./scripts/test-package.ps1 -Archive (Get-ChildItem artifacts/source-check/*-source.zip).FullName
      - run: node --test tests/npm-release.test.mjs tests/release-gate.test.mjs tests/release-workflow.test.mjs tests/release-promotion.test.mjs
