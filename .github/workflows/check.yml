name: Package checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_evidence_directory:
        description: Reviewed Desktop evidence bundle directory available in this checkout
        required: true
        default: release/evidence
        type: string
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # These source artifacts are candidates, never final releases.
      - run: ./scripts/build-package.ps1 -OutputDirectory artifacts/source-check
      - run: ./scripts/test-package.ps1 -Archive (Get-ChildItem artifacts/source-check/*-source.zip).FullName
      - run: node --test tests/release-gate.test.mjs tests/release-workflow.test.mjs
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/release.mjs prepare --source . --output artifacts/candidate --report artifacts/prepare-result.json
      - name: Require actual Desktop evidence and finalize
        env:
          BFS_RELEASE_EVIDENCE_DIRECTORY: ${{ inputs.desktop_evidence_directory }}
        run: |
          $candidate = (Get-ChildItem artifacts/candidate/*.zip).FullName
          node scripts/release.mjs finalize --candidate $candidate --evidence "$env:BFS_RELEASE_EVIDENCE_DIRECTORY" --output artifacts/final --report artifacts/release-result.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: artifacts/final/
          if-no-files-found: error
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: artifacts/*-result.json
          if-no-files-found: ignore
